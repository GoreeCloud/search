# GoreeCloud Search — FREE-first, non-Tor Development profile.
# Ordinary search requests originate from the staging/VPS public IP.
# This is separate from the running private/Tor Development configuration.
# Never attach this profile to a public Internet listener without security review.
# Private/local GoreeCloud Search: approved federated provider families.
# Brave Search is the search service (not the Brave Browser executable).
# Startpage's upstream connector may be challenged by proof-of-work CAPTCHA.
# Do not use this profile unchanged for an Internet-facing instance.
use_default_settings:
  engines:
    keep_only:
      - brave
      - startpage
      - brave.images
      - brave.videos
      - brave.news
      - startpage images
      - startpage news
      - qwant
      - qwant images
      - qwant videos
      - qwant news
      - duckduckgo
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news
      - ecosia
      - bing
      - bing images
      - bing videos
      - bing news
      - google
      - google images
      - google videos
      - google news
