# Categories are restricted to the approved seven-family adapter allowlist (Web, Images, Videos, News).
categories_as_tabs:
  general:
  images:
  videos:
  news:
goreecloud:
  private_search: true
  max_query_chars: 512
  max_provider_fanout: 7
  # Single-worker, global request admission, independent of client identifiers.
  request_budget_per_minute: 12
  # Free-first mode: standard HTTPS requests, with no Tor or paid API account.
  # Selected providers can see the server's public IP address and search terms.
  require_anonymous_egress: false
outgoing:
  # Direct, ordinary HTTPS to publicly accessible search interfaces.
  # This does not circumvent CAPTCHAs, 403 responses or provider limits.
  # Do not send queries to any paid API from this profile.
  request_timeout: 10.0
  max_request_timeout: 10.0
  proxies: {}
  using_tor_proxy: false
  max_connections: 20
general:
  instance_name: "GoreeCloud Search"
  enable_metrics: false
  open_metrics: ""
brand:
  docs_url: https://github.com/GoreeCloud/search
  wiki_url: https://github.com/GoreeCloud/search
  issue_url: https://github.com/GoreeCloud/search/issues
  public_instances: ""
search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  formats:
    - html
    - json
server:
  bind_address: "127.0.0.1"
  public_instance: false
  limiter: false
  image_proxy: true
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Referrer-Policy: no-referrer
    X-Robots-Tag: noindex, nofollow
    Permissions-Policy: "camera=(), microphone=(), geolocation=()"
preferences:
  lock:
    - method
    - query_in_title
    - autocomplete
    - favicon_resolver
    - image_proxy
ui:
  default_theme: simple
  query_in_title: false
  theme_args:
    simple_style: auto
