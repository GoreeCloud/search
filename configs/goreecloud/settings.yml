# Categories are restricted to the approved seven-family adapter allowlist (Web, Images, Videos, News).
categories_as_tabs:
  general:
  images:
  videos:
  news:
goreecloud:
  private_search: true
  max_query_chars: 512
  max_provider_fanout: 7
  # Required for every provider and image-proxy outbound request.
  # The local SOCKS5H gateway must be independently verified as a privacy relay.
  require_anonymous_egress: true
outgoing:
  # Never bypass this relay or resolve provider DNS locally.
  # With no trusted SOCKS5H service listening, searches fail closed.
  proxies:
    all://: socks5h://127.0.0.1:9050
  # A SOCKS gateway alone does not attest Tor anonymity.
  using_tor_proxy: true
  extra_proxy_timeout: 10
general:
  instance_name: "GoreeCloud Search"
  enable_metrics: false
  open_metrics: ""
brand:
  docs_url: https://github.com/GoreeCloud/search
  wiki_url: https://github.com/GoreeCloud/search
  issue_url: https://github.com/GoreeCloud/search/issues
  public_instances: ""
search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  formats:
    - html
    - json
server:
  bind_address: "127.0.0.1"
  public_instance: false
  limiter: false
  image_proxy: true
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Referrer-Policy: no-referrer
    X-Robots-Tag: noindex, nofollow
    Permissions-Policy: "camera=(), microphone=(), geolocation=()"
preferences:
  lock:
    - method
    - query_in_title
    - autocomplete
    - favicon_resolver
    - image_proxy
ui:
  default_theme: simple
  query_in_title: false
  theme_args:
    simple_style: auto
