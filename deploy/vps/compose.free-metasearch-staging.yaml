# Disposable free SearXNG metasearch. No Tor, subscriptions, API keys or host ports.
# Separate from LIVE GoreeCloud Search, Caddy, NetBird and production volumes.
name: goreecloud-search-free-staging
services:
  search:
    image: ${SEARCH_FREE_IMAGE:?Pin a locally verified Search image}
    user: "977:977"
    entrypoint: ["/usr/local/searxng/.venv/bin/granian", "searx.webapp:app"]
    environment:
      SEARXNG_SECRET: ${SEARCH_FREE_SECRET:?Set a separate random temporary secret}
      SEARXNG_SETTINGS_PATH: /usr/local/searxng/free-settings.yml
      GOREECLOUD_SEARCH_PRIVATE_HOST: search-dev.goreecloud.com
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
      GRANIAN_WORKERS: "1"
      GRANIAN_INTERFACE: wsgi
      GRANIAN_WEBSOCKETS: "false"
      GRANIAN_BLOCKING_THREADS: "4"
    volumes:
      - ../../configs/goreecloud/settings.free-first.yml:/usr/local/searxng/free-settings.yml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777
      - /var/cache/searxng:rw,nosuid,noexec,size=64m,uid=977,gid=977
      - /etc/searxng:rw,nosuid,noexec,size=8m,uid=977,gid=977
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"
    pids_limit: 128
    mem_limit: 768m
    networks:
      provider_egress: {}
      app_link: {}
  ingress:
    image: ${SEARCH_FREE_INGRESS_IMAGE:?Pin a locally inspected Caddy image}
    user: "977:977"
    entrypoint: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.hardened-ingress:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=8m,uid=977,gid=977
      - /data:rw,nosuid,noexec,size=8m,uid=977,gid=977
      - /config:rw,nosuid,noexec,size=8m,uid=977,gid=977
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    init: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "3"
    pids_limit: 48
    mem_limit: 128m
    depends_on: [search]
    networks:
      app_link: {}
      private_ingress:
        aliases:
          - goreecloud-search-free-staging-gateway
networks:
  app_link:
    driver: bridge
    internal: true
    enable_ipv6: false
  provider_egress:
    driver: bridge
    internal: false
    enable_ipv6: false
  private_ingress:
    external: true
    name: ${SEARCH_FREE_INGRESS_NETWORK:?Use a uniquely named scratch ingress network}
