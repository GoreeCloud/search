schema_version: '0.4'

component:
  type: service
  id: goreecloud-search
  product_name: GoreeCloud Search
  repository: GoreeCloud/search

lifecycle: development
version: 0.1.0.dev14

supported_platforms:
  - linux

api:
  versions:
    - goreecloud.search-index.v1
    - '1'
  endpoints:
    - name: search-capability-discovery
      url: /api/v1/status
      purpose: Development capability discovery for the bounded Index-originated Search contract.
    - name: index-originated-search
      url: /api/v1/search
      purpose: Development authenticated JSON POST boundary for cycle-safe Index-originated Search delegation.
    - name: service-health
      url: /healthz
      purpose: Development liveness surface; not accepted production health evidence.
    - name: service-readiness
      url: /readyz
      purpose: Development source-level readiness surface; not accepted production readiness evidence.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PLANNED-FEATURES.md
    notes: GoreeCloud Manager operational inventory, configuration, lifecycle, health, and administrative visibility are applicable to Search, but no accepted Manager runtime integration or administrator interface exists on authoritative main.

  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - PRIVACY POLICY.md
      - PLANNED-FEATURES.md
    notes: Search has privacy-aware planning plus a Development source boundary that requires an injected producer-authoritative Privacy Shield capability-reference verifier with exact expected claims and single-use consumption before Index-originated execution. No accepted live verifier transport, receipt/evidence integration, or production acceptance exists.

  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - PLANNED-FEATURES.md
    notes: Search implements bounded provider execution and provenance validation, but no accepted Wardveil Security runtime evidence, trust, threat, or protection integration exists.

  everkeep:
    result: not-applicable-justified
    version: null
    evidence:
      - README.md
      - PRIVACY POLICY.md
    notes: Authoritative main persists no search history, account data, index data, or other material user/service state. Everkeep must be re-evaluated before persistent state, deployed configuration state, or recovery-critical runtime data is accepted.

  glaze_ui:
    result: not-applicable-justified
    version: null
    evidence:
      - README.md
      - PLANNED-FEATURES.md
    notes: Authoritative main exposes no accepted GoreeCloud-controlled user or administrator interface. Glaze UI becomes applicable before any Search UI is accepted.

  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - PLANNED-FEATURES.md
    notes: GoreeCloud Mesh discovery, dependency, capability, and service-coordination integration are planned but not implemented or accepted on authoritative main.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SECURITY.md
      - PLANNED-FEATURES.md
    notes: The Development candidate requires an injected GoreeCloud Identity verifier and binds the authenticated requester exactly to goreecloud-index before Search execution. No accepted live Identity transport, token issuer/format, isolation, revocation, or production acceptance exists.

  policy:
    result: applicable-blocked
    version: null
    evidence:
      - PLANNED-FEATURES.md
      - SECURITY.md
    notes: GoreeCloud Policy is applicable to shared content, source, provider, administrative, and execution policy decisions, but producer-authoritative Policy evaluation, freshness, explanation, enforcement, and evidence integration are not implemented or accepted on authoritative main.

  observability:
    result: applicable-blocked
    version: null
    evidence:
      - PLANNED-FEATURES.md
      - SECURITY.md
    notes: The Development candidate exposes bounded source-level health and readiness endpoints, but no accepted Observability integration, target-runtime publication, signal freshness, alerting, or operational acceptance exists.

health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: false
    requirements: []
  restore:
    required: false
    requirements: []
  export:
    required: false
    requirements: []
  portability:
    required: false
    requirements: []

external_dependencies: []

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: null
  requires:
    - goreecloud-platform-contract==0.4
  provides:
    - goreecloud.search-index.v1
    - goreecloud-search-provider-execution
    - goreecloud-search-query-disclosure-budget
    - goreecloud-search-authenticated-index-delegation-http-v1
    - goreecloud.search-index-delegation.v1
    - goreecloud-search-index-http-boundary-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - PLANNED-FEATURES.md
    - PRIVACY POLICY.md
    - SECURITY.md
    - NOTES.md
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield source verification is present for the Index HTTP candidate, but live verifier transport, evidence/receipt integration, runtime acceptance, and production acceptance are incomplete.
    - Wardveil Security runtime evidence and production security acceptance are incomplete.
    - GoreeCloud Mesh discovery, dependency, capability, and runtime coordination acceptance are incomplete.
    - GoreeCloud Identity requester verification is required by the Index HTTP candidate, but live authentication transport, issuer/credential policy, authorization, isolation, revocation, and runtime acceptance are incomplete.
    - GoreeCloud Policy decision, enforcement, freshness, explanation, and evidence integration are incomplete.
    - Source-level health/readiness endpoints exist in the candidate, but GoreeCloud Observability diagnostics, performance, freshness, alerting, and operational acceptance are incomplete.
    - Candidate source exposes health/readiness interfaces, but no target-runtime or production health/readiness acceptance exists.
    - The candidate adds a bounded authenticated Index HTTP source boundary, but it is not automatically started or deployed and no approved live external network provider is present.
    - No accepted GoreeCloud-controlled Search UI exists; Glaze UI remains not applicable to the current authoritative runtime slice and must be re-evaluated before UI acceptance.
    - Persistent-state continuity requirements remain not applicable to the current authoritative runtime slice and must be re-evaluated before persistent or recovery-critical state is accepted.
    - No Stable or production-approved GoreeCloud Search release evidence is declared.
