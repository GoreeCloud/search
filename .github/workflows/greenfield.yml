name: Greenfield Search foundation
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'security/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify SQLite FTS5
        run: python -c 'import sqlite3; db=sqlite3.connect(":memory:"); db.execute("CREATE VIRTUAL TABLE t USING fts5(content)")'
      - name: Compile and test new implementation without network dependencies
        run: |
          python -m compileall -q goreecloud_search scripts tests
          python scripts/verify_greenfield.py
          node --check web/app.js
