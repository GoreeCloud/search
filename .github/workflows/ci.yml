name: Search CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    name: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: goree_search
          POSTGRES_USER: goree_search
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goree_search"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://goree_search:ci_test_only@localhost:5432/goree_search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q goree_search
      - run: python -m pytest -q
  index:
    name: index-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      opensearch:
        image: opensearchproject/opensearch:3.10.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    env:
      TEST_OPENSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Confirm disposable OpenSearch service is ready
        run: |
          python - <<'PY'
          import time
          from opensearchpy import OpenSearch
          client = OpenSearch(["http://127.0.0.1:9200"], timeout=2, max_retries=0)
          for attempt in range(60):
              try:
                  if client.ping():
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Disposable OpenSearch did not become ready")
          PY
      - run: python -m pytest -q tests/test_index_smoke.py
  web:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
