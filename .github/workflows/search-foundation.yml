name: GoreeCloud Search foundation
on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'security/**'
      - 'stabilize/**'
      - 'deploy/**'
      - 'design/**'
      - 'test/**'
permissions:
  contents: read
jobs:
  runtime-and-boundaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned SearXNG dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile imported search implementation
        run: python -m compileall -q searx
      - name: Private Search contract and runtime smoke
        run: python -m unittest discover -s tests/goreecloud -v
      - name: Install focused upstream test harness
        run: python -m pip install nose2==0.16.0 aiounittest==1.5.0 parameterized==0.9.0 mock==5.2.0
      - name: SearXNG query, engine-routing and settings regressions
        run: |
          export SEARXNG_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m nose2 -s tests/unit test_query test_webadapter test_settings_loader test_webapp -v
  browser-home-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install SearXNG and browser harness
        run: |
          python -m pip install -r requirements.txt
          python -m pip install selenium==4.50.0
      - name: Verify local homepage at desktop and phone widths
        run: python tests/goreecloud/browser_home_smoke.py
      - name: Retain synthetic UI screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: search-glaze-browser-smoke
          path: artifacts/search-browser/*.png
          retention-days: 7
          if-no-files-found: warn

  private-granian-socket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned private Search server and dependencies
        run: python -m pip install -r requirements.txt granian==2.8.4
      - name: Verify real Granian socket is loopback-only without provider calls
        run: python tests/goreecloud/granian_private_listener_smoke.py
