name: Native Search Development
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'security/**'
      - 'stabilize/**'
      - 'deploy/**'
      - 'design/**'
      - 'test/**'
  pull_request:
permissions:
  contents: read
jobs:
  native-unit:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: SQLite FTS5 and unit tests
        run: |
          python -c 'import sqlite3; c=sqlite3.connect(":memory:"); c.execute("CREATE VIRTUAL TABLE f USING fts5(text)")'
          python -m unittest discover -s tests/native -v
      - name: Fixture indexing smoke
        run: |
          python -m native_search import-json --db /tmp/native-demo.db --input tests/native/fixtures.json
