name: Native Search Development
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'security/**'
      - 'stabilize/**'
      - 'deploy/**'
      - 'design/**'
      - 'test/**'
      - 'ci/**'
  pull_request:
permissions:
  contents: read
jobs:
  native-unit:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR merge refs are synthetic and must not be represented as the
          # source that an exact-checkout native artifact was built from.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: SQLite FTS5 and unit tests
        run: |
          python -c 'import sqlite3; c=sqlite3.connect(":memory:"); c.execute("CREATE VIRTUAL TABLE f USING fts5(text)")'
          python -m unittest discover -s tests/native -v
      - name: Fixture indexing smoke
        run: |
          python -m native_search import-json --db /tmp/native-demo.db --input tests/native/fixtures.json
      - name: Build and run exact-source owned Linux candidate, uninstalled
        if: matrix.python-version == '3.12'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/build_native_linux_service.py \
            --expected-sha "$EXPECTED_SOURCE_SHA" \
            --output "$RUNNER_TEMP/goreecloud-search-native-candidate.pyz"
          python tests/native/native_candidate_runner_smoke.py \
            --archive "$RUNNER_TEMP/goreecloud-search-native-candidate.pyz" \
            --expected-sha "$EXPECTED_SOURCE_SHA"
      - name: Exercise real disposable systemd service lifecycle
        # Never run this privileged gate against an untrusted fork checkout.
        # The source itself is executed by systemd as 'nobody'; the temporary
        # unit manager requires short-lived sudo on an isolated hosted runner.
        if: >-
          matrix.python-version == '3.12' && runner.os == 'Linux' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == 'GoreeCloud/search')
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 tests/native/native_systemd_lifecycle_smoke.py \
              --archive "$RUNNER_TEMP/goreecloud-search-native-candidate.pyz" \
              --expected-sha "$EXPECTED_SOURCE_SHA"
