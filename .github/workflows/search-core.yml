name: Search core verification

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run standard-library regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python3 -m compileall -q goreecloud_search tests
